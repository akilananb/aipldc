apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-postgres
  namespace: pdlc
  labels: {app: temporal-postgres}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: temporal-postgres}
  template:
    metadata:
      labels: {app: temporal-postgres}
    spec:
      enableServiceLinks: false
      containers:
        - name: temporal-postgres
          image: postgres:13-alpine
          env:
            - {name: POSTGRES_USER, value: temporal}
            - {name: POSTGRES_PASSWORD, value: temporal}
          ports:
            - {containerPort: 5432}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "temporal"]}
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: temporal-postgres-data}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-postgres
  namespace: pdlc
spec:
  type: ClusterIP
  selector: {app: temporal-postgres}
  ports:
    - {port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: pdlc
  labels: {app: temporal}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: temporal}
  template:
    metadata:
      labels: {app: temporal}
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z temporal-postgres 5432; do echo waiting; sleep 2; done"]
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.27
          env:
            - {name: DB, value: postgres12}
            - {name: DB_PORT, value: "5432"}
            - {name: POSTGRES_USER, value: temporal}
            - {name: POSTGRES_PWD, value: temporal}
            - {name: POSTGRES_SEEDS, value: temporal-postgres}
          ports:
            - {containerPort: 7233}
          readinessProbe:
            tcpSocket: {port: 7233}
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: pdlc
spec:
  type: LoadBalancer
  selector: {app: temporal}
  ports:
    - {port: 7233, targetPort: 7233}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: pdlc
  labels: {app: temporal-ui}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: temporal-ui}
  template:
    metadata:
      labels: {app: temporal-ui}
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z temporal 7233; do echo waiting; sleep 2; done"]
      containers:
        - name: temporal-ui
          image: temporalio/ui:2.35.0
          env:
            - {name: TEMPORAL_ADDRESS, value: "temporal:7233"}
            - {name: TEMPORAL_CORS_ORIGINS, value: "http://localhost:3000"}
          ports:
            - {containerPort: 8080}
          readinessProbe:
            tcpSocket: {port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: pdlc
spec:
  type: LoadBalancer
  selector: {app: temporal-ui}
  ports:
    - {port: 8080, targetPort: 8080}
