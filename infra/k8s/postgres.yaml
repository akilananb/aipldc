apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: pdlc
  labels: {app: postgres}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: pdlc}
            - {name: POSTGRES_USER, value: pdlc}
            - {name: POSTGRES_PASSWORD, value: pdlc}
          ports:
            - {containerPort: 5432}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "pdlc", "-d", "pdlc"]}
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pdlc
spec:
  type: LoadBalancer
  selector: {app: postgres}
  ports:
    - {port: 5432, targetPort: 5432}
