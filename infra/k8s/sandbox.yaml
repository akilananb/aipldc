# Sandbox tools on Kubernetes (docs/phase-2-execution-spec.md slice 2.4). Optional: not applied by
# the Tiltfile, because it needs gVisor (runsc) installed on the nodes. scripts/sandbox-colima.sh
# installs gVisor in the Colima VM, applies this file and switches the agents Deployment to it.
#
# - Sandbox Jobs run in their own namespace under the gvisor RuntimeClass.
# - The agents service account may manage only Jobs, per-call Secrets, pods/logs and the
#   NetworkPolicy there - nothing in any other namespace, and nothing cluster-wide.
# - Sandbox pods reach the network only through the egress proxy inside the agents pods (port
#   3128, via the Service below); KubernetesJobSandbox installs the default-deny NetworkPolicy.
apiVersion: v1
kind: Namespace
metadata:
  name: pdlc-sandbox
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agents-sandbox
  namespace: pdlc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-runner
  namespace: pdlc-sandbox
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agents-sandbox-runner
  namespace: pdlc-sandbox
subjects:
  - kind: ServiceAccount
    name: agents-sandbox
    namespace: pdlc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-runner
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-egress-proxy
  namespace: pdlc
spec:
  selector: {app: agents}
  ports:
    - {name: proxy, port: 3128, targetPort: 3128}
