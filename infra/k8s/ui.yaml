apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: pdlc
  labels: {app: ui}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: ui}
  template:
    metadata:
      labels: {app: ui}
    spec:
      enableServiceLinks: false
      containers:
        - name: ui
          image: pdlc-pilot/ui
          ports:
            - {containerPort: 80}
          readinessProbe:
            httpGet: {path: /, port: 80}
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: pdlc
spec:
  type: LoadBalancer
  selector: {app: ui}
  ports:
    - {port: 5173, targetPort: 80}
