profiles:
  local:
    board:
      provider: local-jdbc               # Postgres-backed LocalBoardAdapter; anything other than azure-devops/local-jdbc resolves to InMemoryBoardAdapter
      org: local
      project: restaurant
      types: { feature: feature, story: story, task: task, bug: bug }
      states:
        new: new
        needs-clarification: needs-clarification
        ready-for-story: ready-for-story
        awaiting-G1: awaiting-G1
        queued: queued
        approved: approved
        planned: planned
        in-progress: in-progress
        awaiting-G2: awaiting-G2
        awaiting-G3: awaiting-G3
        done: done
        stale: stale
      auth: { kind: none, secret_ref: kv://none }
    repos:
      - id: restaurant-runtime
        provider: local-git             # real git CLI adapter; anything other than github/local-git resolves to InMemoryRepoAdapter
        url: /Users/work/Documents/restaurant-runtime
        default_branch: restaurant-base
        spec_dir: openspec
        areas: [orders]
        primary: true
    project:
      name: "Restaurant runtime"
      confluence_url: ""
      docs: []
      brief: ""
    notify:
      provider: none
      channel: none
    agents:
      # Any OpenAI-compatible base URL, used verbatim: the client appends /chat/completions, so
      # include /v1 when the server expects it. Overridden by PDLC_LLM_BASE_URL. From inside
      # Compose a host-run server is http://host.docker.internal:<port>/v1, not localhost.
      gateway: https://openrouter.ai/api/v1
      # prompts_dir: /app/prompts   # optional: directory of *.mustache files overriding the bundled prompt templates (mount it into the agents container)
      roles:
        grill: { model: sonnet }
        po:    { model: sonnet, budget_tokens: 40000 }
        review: { model: sonnet, budget_tokens: 30000 }
        release: { model: sonnet, budget_tokens: 30000 }
        mention: { model: sonnet, budget_tokens: 20000 }
        quality: { model: sonnet, budget_tokens: 20000 }
        plan: { model: sonnet, budget_tokens: 40000 }
    gates:
      G1: { roles: [PO, SquadLead], sod: true }
      G2: { roles: [FSDeveloper, QA], sod: true }
      G3: { roles: [PO, SquadLead, QA], sod: true }
      PLAN: { roles: [SquadLead], sod: true }

  ado-pilot:
    board:
      provider: azure-devops
      org: https://dev.azure.com/acme
      project: Payments
      types: { feature: Feature, story: "User Story", task: Task, bug: Bug }
      states:
        new: New
        needs-clarification: "Needs Clarification"
        ready-for-story: "Ready for Story"
        awaiting-G1: "Awaiting Approval"
        queued: New
        approved: Approved
        planned: Planned
        in-progress: Active
        awaiting-G2: "In Review"
        awaiting-G3: "Awaiting Release"
        done: Closed
        stale: New
      auth: { kind: pat, secret_ref: kv://ado-pat }
    repos:
      - id: orders-service
        provider: github
        url: https://github.com/acme/orders-service
        default_branch: main
        spec_dir: openspec
        areas: []
        primary: true
    project:
      name: "Payments"
      confluence_url: "https://acme.atlassian.net/wiki/spaces/PAY"
      docs: []
      brief: ""
    notify:
      provider: none
      channel: none
    agents:
      # Any OpenAI-compatible base URL, used verbatim: the client appends /chat/completions, so
      # include /v1 when the server expects it. Overridden by PDLC_LLM_BASE_URL. From inside
      # Compose a host-run server is http://host.docker.internal:<port>/v1, not localhost.
      gateway: http://litellm:4000/v1
      # prompts_dir: /app/prompts   # optional: directory of *.mustache files overriding the bundled prompt templates (mount it into the agents container)
      roles:
        grill: { model: anthropic/claude-sonnet, budget_tokens: 8000 }
        po:    { model: anthropic/claude-sonnet, budget_tokens: 40000 }
        review: { model: anthropic/claude-sonnet, budget_tokens: 30000 }
        release: { model: anthropic/claude-sonnet, budget_tokens: 30000 }
        mention: { model: anthropic/claude-sonnet, budget_tokens: 20000 }
        quality: { model: anthropic/claude-sonnet, budget_tokens: 20000 }
        plan: { model: anthropic/claude-sonnet, budget_tokens: 40000 }
    gates:
      G1: { roles: [PO, SquadLead], sod: true }
      G2: { roles: [FSDeveloper, QA], sod: true }
      G3: { roles: [PO, SquadLead, QA], sod: true }
      PLAN: { roles: [SquadLead], sod: true }
