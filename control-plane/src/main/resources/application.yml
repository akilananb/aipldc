server:
  port: 8081
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: control-plane
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pdlc}
    username: ${SPRING_DATASOURCE_USERNAME:pdlc}
    password: ${SPRING_DATASOURCE_PASSWORD:pdlc}
  flyway:
    enabled: true
    locations: classpath:db/migration

pdlc:
  config-path: ${PDLC_CONFIG_PATH:infra/pdlc.yaml}
  active-profile: ${PDLC_ACTIVE_PROFILE:local}
  build-agent:
    token: ${BUILD_AGENT_TOKEN:}
  demo:
    enabled: ${PDLC_DEMO_ENABLED:false}
  # Phase 1 slice 2 (docs/phase-1-execution-spec.md). Enterprise login is enabled by the standard
  # Spring keys, e.g. env SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_PDLC_ISSUER_URI,
  # SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_PDLC_CLIENT_ID/_CLIENT_SECRET/_SCOPE (openid,profile,email),
  # and service JWTs by SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI. role-mapping (IdP
  # group -> PO|SquadLead|FSDeveloper|QA|Admin) is easiest supplied via SPRING_APPLICATION_JSON.
  identity:
    dev-headers: ${PDLC_IDENTITY_DEV_HEADERS:false}
    user-claim: ${PDLC_IDENTITY_USER_CLAIM:email}
    role-claim: ${PDLC_IDENTITY_ROLE_CLAIM:groups}
    post-login-redirect: ${PDLC_IDENTITY_POST_LOGIN_REDIRECT:http://localhost:5173/}
    allowed-origins: ${PDLC_IDENTITY_ALLOWED_ORIGINS:http://localhost:*}
    service-token: ${PDLC_SERVICE_TOKEN:}
    webhook-token: ${PDLC_WEBHOOK_TOKEN:}

temporal:
  target: ${TEMPORAL_TARGET:127.0.0.1:7233}
  namespace: ${TEMPORAL_NAMESPACE:default}

management:
  endpoints:
    web:
      exposure:
        include: health,info
