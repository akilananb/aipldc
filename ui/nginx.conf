server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints every asset filename with a content hash, so /assets/* is safe to cache
    # forever; index.html references those hashed filenames and must never be served stale, or
    # the browser keeps loading an old JS/CSS bundle after a redeploy.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
